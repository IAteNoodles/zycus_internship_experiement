services:
  zycus:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - zycus_data:/app/output
      - zycus_db:/app/zycus.db
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}

volumes:
  zycus_data:
  zycus_db:
