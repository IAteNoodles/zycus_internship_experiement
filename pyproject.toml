[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["output", "tests"]

[project]
name = "zycus"
version = "0.1.0"
description = "Project Health Reporting Agent"
readme = "README.md"
requires-python = ">=3.10.5"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.139.0",
    "fpdf2>=2.8.0",
    "uvicorn>=0.51.0",
    "apscheduler>=3.11.3",
    "streamlit>=1.59.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
