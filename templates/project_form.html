{% extends "base.html" %}
{% block title %}{% if project %}Edit{% else %}New{% endif %} Project - Zycus{% endblock %}
{% block content %}
<h3 class="mb-3">{% if project %}Edit{% else %}New{% endif %} Project</h3>
<form method="post" action="{% if project %}/project/{{ project.id }}/update{% else %}/project/new{% endif %}">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required value="{{ project.name if project else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Stakeholders (comma-separated)</label>
    <input type="text" name="stakeholders" class="form-control" value="{{ project.stakeholders|join(', ') if project else '' }}">
  </div>
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Budget ($)</label>
      <input type="number" step="0.01" name="budget" class="form-control" value="{{ project.budget if project else 0 }}">
    </div>
    <div class="col">
      <label class="form-label">Start Date</label>
      <input type="date" name="start_date" class="form-control" required value="{{ project.start_date if project else '' }}">
    </div>
    <div class="col">
      <label class="form-label">End Date</label>
      <input type="date" name="end_date" class="form-control" required value="{{ project.end_date if project else '' }}">
    </div>
  </div>
  <button type="submit" class="btn btn-primary">{% if project %}Update{% else %}Create{% endif %}</button>
  <a href="/" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
