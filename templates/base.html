<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Zycus{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f7fa; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.navbar-brand { font-weight: 700; letter-spacing: -0.3px; font-size: 1.2rem; }
.nav-link { font-size: 0.9rem; }
.badge-rag { font-size: 0.85rem; padding: 0.35em 0.65em; }
.card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: box-shadow .15s; }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.card-header { font-weight: 600; font-size: 0.95rem; background: #fff; border-bottom: 1px solid #eee; }
.rag-Green { background: #d4edda; color: #155724; }
.rag-Amber { background: #fff3cd; color: #856404; }
.rag-Red { background: #f8d7da; color: #721c24; }
.rag-N\/A { background: #e2e3e5; color: #383d41; }
.signal-0 { color: #28a745; }
.signal-1 { color: #ffc107; }
.signal-2 { color: #dc3545; }
.alert-flash { position: fixed; top: 1rem; right: 1rem; z-index: 9999; min-width: 280px; max-width: 420px; animation: slideIn .25s ease-out; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 py-2">
  <div class="container">
    <a class="navbar-brand" href="/">Zycus</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/project/new">New Project</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports">Reports</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container">
{% if request.query_params.get('flash') %}
<div class="alert alert-flash alert-{{ request.query_params.get('flash_type', 'info') }} alert-dismissible fade show" role="alert">
  {{ request.query_params.get('flash') }}
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>setTimeout(()=>{document.querySelector('.alert-flash')?.remove()},5000)</script>
</body>
</html>
