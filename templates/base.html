<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Zycus - Project Health{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f7fa; }
.navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
.badge-rag { font-size: 0.85rem; padding: 0.35em 0.65em; }
.card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card-header { font-weight: 600; }
.rag-Green { background: #d4edda; color: #155724; }
.rag-Amber { background: #fff3cd; color: #856404; }
.rag-Red { background: #f8d7da; color: #721c24; }
.rag-N\/A { background: #e2e3e5; color: #383d41; }
.signal-0 { color: #28a745; }
.signal-1 { color: #ffc107; }
.signal-2 { color: #dc3545; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Zycus</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/project/new">New Project</a>
      <a class="nav-link" href="/reports">Reports</a>
    </div>
  </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
